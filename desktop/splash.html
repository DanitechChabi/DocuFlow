<!DOCTYPE html>
<!--
  splash.html — écran d'attente du démarrage.
-->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>DocuFlow</title>
  <style>
    :root { --bleu: #3b82f6; --or: #d4af37; --bg: #0f172a; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: radial-gradient(circle at 50% 40%, #1e293b 0%, var(--bg) 70%);
      color: #e2e8f0;
      font-family: "Segoe UI", system-ui, sans-serif;
      user-select: none;
      overflow: hidden;
      transition: opacity 0.6s ease-out;
    }
    body.fade-out { opacity: 0; }

    .halo {
      position: fixed;
      width: 620px; height: 620px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,.35) 0%, rgba(59,130,246,.12) 40%, transparent 70%);
      filter: blur(60px);
      animation: respire 4s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }
    @keyframes respire { 0%,100% { transform: scale(1); opacity:.6 } 50% { transform: scale(1.1); opacity:1 } }

    .marque {
      position: relative;
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 1px;
      text-shadow: 0 0 60px rgba(59,130,246,.6);
      animation: apparition 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
      transform: translateY(10px);
    }
    .marque b { font-weight: 700; color: #fff; }

    @keyframes apparition {
      to { opacity: 1; transform: translateY(0); }
    }

    .filet {
      width: 80px; height: 3px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--or), transparent);
      animation: app_filet 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: center;
    }
    @keyframes app_filet {
      to { opacity: 1; transform: scaleX(1); }
    }

    .piste {
      position: relative;
      width: 260px; height: 3px;
      background: rgba(148,163,184,.2);
      border-radius: 2px;
      overflow: hidden;
      animation: apparition_piste 1.5s ease-out forwards;
      opacity: 0;
    }
    @keyframes apparition_piste {
      to { opacity: 1; }
    }
    .piste::after {
      content: "";
      position: absolute; inset: 0 auto 0 0;
      width: 40%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--bleu), transparent);
      animation: defile 1.4s ease-in-out infinite;
    }
    @keyframes defile {
      0%   { transform: translateX(-110%) }
      100% { transform: translateX(360%) }
    }

    #etat {
      position: relative;
      min-height: 20px;
      font-size: 13.5px;
      color: #94a3b8;
      text-align: center;
      padding: 0 30px;
      animation: apparition_etat 1.8s ease-out forwards;
      opacity: 0;
    }
    @keyframes apparition_etat {
      to { opacity: 1; }
    }

    #note {
      position: relative;
      font-size: 12px;
      color: #64748b;
      opacity: 0;
      transition: opacity .5s;
    }
    #note.visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="halo"></div>
  <div class="marque">Docu<b>Flow</b></div>
  <div class="filet"></div>
  <div class="piste"></div>
  <div id="etat">Démarrage…</div>
  <div id="note">Première ouverture : la préparation peut prendre une minute.</div>

  <script>
    window.majEtat = (texte) => {
      document.getElementById('etat').textContent = texte;
      const longue = /installation|préparation|création/i.test(texte);
      document.getElementById('note').classList.toggle('visible', longue);
    };

    window.fadeOut = () => {
      document.body.classList.add('fade-out');
    };
  </script>
</body>
</html>
